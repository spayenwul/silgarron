# data/data_tables/location_templates.yaml
# Полностью заполненные шаблоны для процедурной генерации названий локаций (биомов)

templates:
  default_template:
    name_patterns: ["Неизвестное Место"]

  # --- Шаблон для поселения ---
  kith_settlement_template:
    name_patterns: ["{Adjective} Утес", "Крепость {Noun}", "{Noun} Дозор"]
    adjectives: [Каменный, Костяной, Последний, Холодный, Ветреный]
    nouns: [Кулака, Дозора, Надежды, Ветров, Гиганта]

  # --- Шаблоны для биомов ---
  pulsating_plains_template:
    name_patterns: ["Пульсирующие Равнины", "Дыхание {Noun}", "Степь {Adjective}"]
    adjectives: [Вечного Ритма, Забытых Сердец, Медленная]
    nouns: [Гиганта, Сильгаррона, Титана]
  spore_savanna_template:
    name_patterns: ["Споровая Саванна", "{Adjective} Пустошь", "Поля {Noun}"]
    adjectives: [Пурпурная, Золотая, Сонная, Пыльная]
    nouns: [Тишины, Спящих Грибов, Забвения]
  geyser_fields_template:
    name_patterns: ["Гейзерные Поля", "{Adjective} Долина", "Поля {Noun}"]
    adjectives: [Паровая, Шипящая, Нестабильная]
    nouns: [Горячего Дыхания, Гнева Земли]
  crystal_scar_template:
    name_patterns: ["Кристаллический Шрам", "Язва {Noun}", "{Adjective} Пустота"]
    adjectives: [Безмолвная, Гладкая, Вечная]
    nouns: [Нового Бога, Порядка]
  megatherium_pastures_template:
    name_patterns: ["Пастбища Мегатериев", "Тропа {Noun}", "{Adjective} Луга"]
    adjectives: [Бескрайние, Древние]
    nouns: [Колоссов, Стад]
  biolume_forest_template:
    name_patterns: ["Биолюмный Лес", "{Adjective} Чаща", "Лес {Noun}"]
    adjectives: [Светящаяся, Изумрудная, Тихая, Живая]
    nouns: [Светляков, Забвения, Древ-Насосов]
  neuroflower_meadows_template:
    name_patterns: ["Луга Нейроцветов", "{Adjective} Поляна", "Долина {Noun}"]
    adjectives: [Мыслящая, Отзывчивая, Сияющая]
    nouns: [Эмоций, Сцепки]
  fungal_mangroves_template:
    name_patterns: ["Грибные Мангры", "{Adjective} Заводи", "Трясина {Noun}"]
    adjectives: [Вязкие, Древние]
    nouns: [Воздушных Корней, Тины]
  silt_flats_template:
    name_patterns: ["Илистые Отмели", "Берег {Noun}", "{Adjective} Трясина"]
    adjectives: [Серая, Влажная]
    nouns: [Отлива, Ткачей]
  blood_clot_thicket_template:
    name_patterns: ["Тромбовый Бурелом", "{Adjective} Чаща", "Сгусток {Noun}"]
    adjectives: [Липкая, Вязкая, Багровая]
    nouns: [Мертвой Лимфы, Застоя]
  bone_needles_template:
    name_patterns: ["Костяные Иглы", "Пики {Noun}", "{Adjective} Шпили"]
    adjectives: [Пронизывающие, Холодные, Острые]
    nouns: [Ветров, Отчаяния, Тишины]
  litho-lichen_slopes_template:
    name_patterns: ["Лито-лишайниковые Склоны", "{Adjective} Склон", "Склоны {Noun}"]
    adjectives: [Цветной, Медленный, Каменный]
    nouns: [Камнеедов, Времени]
  cloud_forest_template:
    name_patterns: ["Облачный Лес", "Туманный {Noun}", "{Adjective} Пояс"]
    adjectives: [Вечно-влажный, Скрытый]
    nouns: [Пик, Склон]
  ruined_spires_template:
    name_patterns: ["Разрушенные Шпили", "Руины {Noun}", "{Adjective} Гнездо"]
    adjectives: [Забытое, Небесное]
    nouns: [Воздушных Князей, Эйри]
  wind_caves_template:
    name_patterns: ["Ветряные Пещеры", "Поющая {Noun}", "{Adjective} Туннель"]
    adjectives: [Гулкий, Сквозной]
    nouns: [Гора, Кость]
  rolling_hills_template:
    name_patterns: ["Холмистая Гряда", "{Adjective} Холмы", "Предгорья {Noun}"]
    adjectives: [Пологие, Зеленые, Бескрайние]
    nouns: [Покоя, Стад]
  broken_lands_template:
    name_patterns: ["Разломы", "Треснувшая {Noun}", "{Adjective} Каньон"]
    adjectives: [Пыльный, Опасный]
    nouns: [Земля, Кожа]
  boneyard_template:
    name_patterns: ["Костяное Кладбище", "Погост {Noun}", "{Adjective} Кости"]
    adjectives: [Древние, Великие]
    nouns: [Гигантов, Мегатериев]
  fortress_hills_template:
    name_patterns: ["Холмы-Крепости", "Дозор {Noun}", "{Adjective} Форпост"]
    adjectives: [Неприступный, Каменный]
    nouns: [Китов, Кулака]
  springheads_template:
    name_patterns: ["Истоки", "Лимфатические {Noun}", "{Adjective} Ключи"]
    adjectives: [Чистые, Живые]
    nouns: [Родники, Источники]
  luminous_fungi_caves_template:
    name_patterns: ["Пещеры Светящихся Грибов", "{Adjective} Грот", "Залы {Noun}"]
    adjectives: [Сияющий, Пульсирующий]
    nouns: [Вечного Света, Мицелия]
  toxic_swamp_template:
    name_patterns: ["Токсичные Топи", "{Adjective} Трясина", "Болота {Noun}"]
    adjectives: [Ядовитая, Пузырящаяся]
    nouns: [Заражения, Топяников]
  barren_wastes_template:
    name_patterns: ["Бесплодные Пустоши", "{Adjective} Земля", "Пустошь {Noun}"]
    adjectives: [Потрескавшаяся, Мертвая]
    nouns: [Отчаяния, Голода]
  black_wall_template:
    name_patterns: ["Черная Стена", "Хитиновый {Noun}", "{Adjective} Край"]
    adjectives: [Непреодолимый, Гладкий]
    nouns: [Бастион, Панцирь]
  crystal_synapse_forest_template:
    name_patterns: ["Лес Кристальных Синапсов", "{Adjective} Ганглий", "Пещера {Noun}"]
    adjectives: [Мыслящий, Сияющий]
    nouns: [Памяти, Снов]
  rainbow_caldera_template:
    name_patterns: ["Радужная Кальдера", "{Adjective} Око", "Озеро {Noun}"]
    adjectives: [Сияющее, Кристальное]
    nouns: [Всех Цветов, Света]