<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <title>Silgarron Chronicles</title>
    <link rel="stylesheet" href="css/styles.css"> <!-- Лучше вынести стили в отдельный файл -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0e1a;
            --secondary-dark: #1a1f2e;
            --accent-bio: #3d8b6f;
            --accent-glow: #5cd9a8;
            --accent-danger: #c74444;
            --text-primary: #e8e8e8;
            --text-secondary: #a0a0a0;
            --border-glow: rgba(92, 217, 168, 0.3);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f2e 50%, #0f1621 100%);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        /* Animated background organisms */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(61, 139, 111, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(92, 217, 168, 0.08) 0%, transparent 50%);
            animation: pulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        /* ===== REGISTRATION SCREEN ===== */
        .registration-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            transition: opacity 0.5s, visibility 0.5s;
        }

        .registration-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .registration-container {
            background: linear-gradient(145deg, #1a1f2e 0%, #0f1621 100%);
            border: 2px solid var(--border-glow);
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(92, 217, 168, 0.1);
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .reg-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .reg-logo h1 {
            font-size: 42px;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-bio));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .reg-logo p {
            color: var(--text-secondary);
            font-size: 14px;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-glow);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 15px;
            background: rgba(26, 31, 46, 0.6);
            border: 1px solid rgba(92, 217, 168, 0.2);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 15px rgba(92, 217, 168, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--accent-bio), var(--accent-glow));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(92, 217, 168, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(92, 217, 168, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* ===== MAIN GAME INTERFACE ===== */
        .game-container {
            display: none;
            height: 100vh;
            flex-direction: row;
        }

        .game-container.active {
            display: flex;
        }

        /* Left Panel - Map */
        .map-panel {
            flex: 2;
            background: rgba(15, 22, 33, 0.8);
            border-right: 1px solid var(--border-glow);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .map-header {
            padding: 20px;
            background: rgba(26, 31, 46, 0.9);
            border-bottom: 1px solid var(--border-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .map-header h2 {
            font-size: 24px;
            color: var(--accent-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-explore {
            padding: 12px 24px;
            background: rgba(61, 139, 111, 0.2);
            border: 2px solid var(--accent-bio);
            border-radius: 8px;
            color: var(--accent-glow);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn-explore:hover {
            background: rgba(61, 139, 111, 0.4);
            box-shadow: 0 0 20px rgba(92, 217, 168, 0.3);
        }

        #world-map {
            flex: 1;
            background: radial-gradient(circle at center, rgba(26, 31, 46, 0.4) 0%, rgba(10, 14, 26, 0.8) 100%);
        }

        /* Right Panel - Info */
        .info-panel {
            flex: 1;
            background: rgba(26, 31, 46, 0.95);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: linear-gradient(145deg, rgba(15, 22, 33, 0.8), rgba(26, 31, 46, 0.6));
            border: 1px solid var(--border-glow);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-glow), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .card h2, .card h3 {
            color: var(--accent-glow);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .location-card h2 {
            font-size: 22px;
        }

        .description {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 6px 14px;
            background: rgba(61, 139, 111, 0.2);
            border: 1px solid var(--accent-bio);
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent-glow);
            text-transform: uppercase;
        }

        /* Health Bar */
        .health-bar {
            position: relative;
            height: 35px;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .health-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-danger), var(--accent-bio), var(--accent-glow));
            transition: width 0.5s ease;
            box-shadow: 0 0 15px rgba(92, 217, 168, 0.5);
        }

        #health-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 35px;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            z-index: 1;
        }

        /* Directions */
        .direction-item {
            padding: 15px;
            margin: 10px 0;
            background: rgba(15, 22, 33, 0.6);
            border-left: 4px solid var(--accent-bio);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .direction-item:hover {
            background: rgba(61, 139, 111, 0.2);
            transform: translateX(5px);
            box-shadow: 0 0 20px rgba(92, 217, 168, 0.2);
        }

        .direction-item.locked {
            border-left-color: var(--accent-danger);
            opacity: 0.6;
            cursor: not-allowed;
        }

        .new-tag {
            background: var(--accent-danger);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 8px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Console */
        .narrative-log {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: rgba(10, 14, 26, 0.8);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            margin-bottom: 15px;
            max-height: 300px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .narrative-entry {
            margin: 10px 0;
            padding: 8px;
            line-height: 1.6;
            border-left: 2px solid var(--accent-bio);
            padding-left: 12px;
        }

        .narrative-entry.player-command {
            color: var(--accent-glow);
            font-weight: 600;
            border-left-color: var(--accent-glow);
        }

        #command-input {
            width: 100%;
            padding: 15px;
            background: rgba(10, 14, 26, 0.8);
            border: 2px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        #command-input:focus {
            outline: none;
            border-color: var(--accent-glow);
            box-shadow: 0 0 20px rgba(92, 217, 168, 0.3);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(10, 14, 26, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-bio);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-glow);
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 26, 0.98);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .loading-screen.active {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(92, 217, 168, 0.2);
            border-top-color: var(--accent-glow);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .game-container {
                flex-direction: column;
            }
            .map-panel {
                height: 50vh;
            }
            .info-panel {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="spinner"></div>
    </div>

    <!-- Registration Screen -->
    <div class="registration-screen" id="registration-screen">
        <div class="registration-container">
            <div class="reg-logo">
                <h1>SILGARRON</h1>
                <p>Chronicles of the Living World</p>
            </div>
            
            <div class="form-group">
                <label for="player-name">Имя искателя</label>
                <input type="text" id="player-name" placeholder="Введите имя вашего персонажа" value="Странник">
            </div>
            
            <div class="form-group">
                <label for="starting-continent">Стартовый континент</label>
                <select id="starting-continent">
                    <option value="torax">Торакс - Костяные равнины</option>
                    <option value="vermis">Вермис - Червивые джунгли</option>
                    <option value="cranium">Краниум - Нейронные горы</option>
                </select>
            </div>
            
            <button class="btn-primary" id="start-journey-btn">Начать путешествие</button>
        </div>
    </div>

    <!-- Main Game Interface -->
    <div class="game-container" id="game-container">
        <div class="map-panel">
            <div class="map-header">
                <h2 id="map-title">⚗️ Карта Сильгаррона</h2>
                <div>
                     <!-- ИЗМЕНЕНИЕ: Добавлены кнопки управления картой -->
                    <button id="explore-btn" class="btn-explore">🔍 Исследовать</button>
                    <button id="world-map-btn" class="btn-explore">🌍 Карта Мира</button>
                </div>
            </div>
            <svg id="world-map" width="100%" height="100%"></svg>
        </div>
        
        <div class="info-panel">
            <div class="card location-card">
                <h2 id="location-name">Загрузка...</h2>
                <div id="location-description" class="description">Мир генерируется...</div>
                <div id="location-tags" class="tags"></div>
            </div>
            
            <div class="card player-card">
                <h3 id="player-name-display">Искатель</h3>
                <div class="health-bar">
                    <div id="health-fill" class="health-fill" style="width: 100%"></div>
                    <span id="health-text">20/20</span>
                </div>
                <div id="inventory" class="inventory"></div>
            </div>
            
            <div class="card directions-card">
                <h3>🧭 Доступные пути</h3>
                <div id="directions-list">
                    <p style="color: var(--text-secondary);">Исследуйте окрестности...</p>
                </div>
            </div>
            
            <div class="card console-card">
                <div id="narrative-log" class="narrative-log">
                    <div class="narrative-entry">Добро пожаловать в Сильгаррон...</div>
                </div>
                <input 
                    type="text" 
                    id="command-input" 
                    placeholder="Введите команду или действие..."
                    autocomplete="off"
                >
            </div>
        </div>
    </div>
        
    <script type="module" src="js/main.js"></script>
    
</body>
</html>
