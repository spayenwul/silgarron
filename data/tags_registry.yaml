      location:sacred:
        name: "Священное место"
      location:trade_route:
        name: "Торговый путь"
      location:isolated:
        name: "Изолированная"
      location:accessible:
        name: "Доступная"
      location:fortified:
        name: "Укрепленная"
      location:coastal:
        name: "Прибрежная"
      location:aquatic:
        name: "Водная"
      location:underground:
        name: "Подземная"
      location:transitional_zone:
        name: "Переходная зона"

  # --- АНОМАЛИИ ---
  anomalies:
    category: supernatural
    tags:
      anomaly:gravity:
        name: "Гравитационная аномалия"
      anomaly:time:
        name: "Темпоральная аномалия"
      anomaly:memory:
        name: "Просачивание памяти"
      anomaly:psychic:
        name: "Психическая аномалия"
      anomaly:psychic_affinity:
        name: "Психическое родство"
      anomaly:mutation:
        name: "Мутагенная аномалия"
      anomaly:sound:
        name: "Акустическая аномалия"
      anomaly:dream:
        name: "Аномалия Сна"
      anomaly:frozen_time:
        name: "Застывшее время"
      anomaly:breathing:
