    location:without_megatherium:
      name: "Без Мегатериев"
      description: "Логический тег для мест, где Мегатерии не могут существовать."


# =============================================================================
# ГЛОБАЛЬНЫЕ ПРАВИЛА СОВМЕСТИМОСТИ
# =============================================================================
# Универсальные синергии и конфликты между тегами

global_compatibility_rules:
  
  # Синергии (эти теги усиливают друг друга)
  synergies:
    - tags: ["surface:stable", "lifestyle:sedentary"]
      bonus: 2.0
      reason: "Стабильная земля идеальна для оседлой жизни"
      
    - tags: ["terrain:elevated", "lifestyle:isolated"]
      bonus: 1.5
      reason: "Горы естественно изолируют"
      
    - tags: ["ecology:fertile", "resource:pure_lymph"]
      bonus: 1.8
      reason: "Чистая лимфа питает богатую экосистему"
      
    - tags: ["manifestation:high", "anomaly:psychic"]
      bonus: 2.5
      reason: "Высокая проводность усиливает психические эффекты"
      
    - tags: ["surface:dynamic", "lifestyle:nomadic"]
      bonus: 1.7
      reason: "Кочевники адаптированы к подвижной земле"

  # Антагонизмы (эти теги конфликтуют)
  conflicts:
    - tags: ["surface:unstable", "lifestyle:sedentary"]
      penalty: 0.2
      reason: "Невозможно строить на нестабильной земле"
      
    - tags: ["ecology:barren", "location:inhabited"]
      penalty: 0.4
      reason: "Трудно жить в бесплодной местности"
      
    - tags: ["manifestation:numb", "narrative:old_gods_legacy"]
      penalty: 0.1
      reason: "Наследие Богов должно быть активным"
      
    - tags: ["terrain:aquatic", "resource:bone_chitin"]
      penalty: 0.3
      reason: "Костехитин не добывается под водой"


# =============================================================================
# СЛУЖЕБНАЯ ИНФОРМАЦИЯ
# =============================================================================

validation_rules:
  required_pillars_per_location:
    - terrain_type
    - surface_stability
    - fertility
    
  max_flavor_tags_per_location: 3
  max_danger_level: 10
  
  # Запрещённые комбинации (жёсткие ограничения)
  forbidden_combinations:
    - ["terrain:aquatic", "terrain:subterranean"]  # Невозможно одновременно
    - ["manifestation:numb", "manifestation:chaotic"]  # Взаимоисключающие
    - ["ecology:barren", "ecology:fertile"]  # Противоположности