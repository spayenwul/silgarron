# Нарративные, уникальные метки.

flavor_tags:
  category: narrative
  tags:
    narrative:old_gods_legacy:
      name: "Наследие Старых Богов"
    narrative:sky_city_ruins:
      name: "Руины Воздушных Княжеств"
    narrative:new_god_ulcer:
      name: "Язва Нового Бога"
    narrative:megafauna_migration:
      name: "Путь Великой Миграции"
    narrative:geode_ruins:
      name: "Руины Геодов"
    narrative:ancient_wound:
      name: "Древняя рана"
    narrative:ancient_catastrophe:
      name: "Древняя катастрофа"
    narrative:shipwrecks:
      name: "Кораблекрушения"
    narrative:deep_ones:
      name: "Глубинные"
    narrative:world_mystery:
      name: "Тайна мира"
    narrative:ocean_gateway:
      name: "Врата в океан"
    narrative:ocean_watchers:
      name: "Наблюдатели за океаном"
    narrative:ancient_mystery:
