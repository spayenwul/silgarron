# =============================================================================
# ЕДИНЫЙ РЕЕСТР ТЕГОВ МИРА СИЛЬГАРРОН (ВЕРСИЯ 2.1 - РАСШИРЕННАЯ)
# =============================================================================
# Это ЗАКОН. Если тега нет здесь, он не существует в системе.
# Версия схемы: 2.1.0
# Дата: 2025-10-05

meta:
  schema_version: "2.1.0"
  description: "Иерархический реестр всех тегов с правилами наследования"

# =============================================================================
# TIER 1: СТОЛПОВЫЕ ТЕГИ (Foundational Tags)
# =============================================================================
# Фундаментальные, часто взаимоисключающие свойства.

pillars:
  
  # --- ФИЗИЧЕСКАЯ ГЕОГРАФИЯ ---
  geography:
    category: physical
    terrain_type:
      mutually_exclusive: true
      tags:
        terrain:flat:
          name: "Плоский рельеф"
          aliases: ["рельеф:горизонтальный"]
        terrain:elevated:
          name: "Возвышенный рельеф"
          aliases: ["рельеф:вертикальный"]
          children:
            - terrain:mountain
            - terrain:hill
            - terrain:cliff
        terrain:subterranean:
          name: "Подземный"
        terrain:aquatic:
          name: "Водный"
        terrain:rough:
          name: "Пересеченная местность"
          description: "Сложный, труднопроходимый рельеф, каньоны, разломы."
          
    surface_stability:
      mutually_exclusive: true
      tags:
        surface:stable:
          name: "Стабильная поверхность"
        surface:dynamic:
          name: "Динамичная поверхность"
        surface:unstable:
          name: "Нестабильная поверхность"

  # --- ЭКОЛОГИЯ ---
  ecology:
    category: physical
    fertility:
      mutually_exclusive: true
      tags:
        ecology:fertile:
          name: "Плодородная"
        ecology:moderate:
          name: "Умеренная"
        ecology:barren:
          name: "Бесплодная"
        ecology:toxic:
          name: "Токсичная"
        ecology:unique:
          name: "Уникальная экосистема"
        ecology:corrupted:
          name: "Искажённая экосистема"
        ecology:corrupted_affinity:
            name: "Склонность к искажению"
            description: "Организмы, которые процветают в искаженных средах."

  # --- КУЛЬТУРА И ОБЩЕСТВО ---
  lifestyle:
    category: cultural
    settlement_type:
      mutually_exclusive: true
      tags:
        lifestyle:sedentary:
          name: "Оседлый образ жизни"
        lifestyle:nomadic:
          name: "Кочевой образ жизни"
        lifestyle:semi_nomadic:
          name: "Полукочевой"
        lifestyle:isolated:
          name: "Изолированный"
          
  social:
    category: cultural
    power_structure:
      mutually_exclusive: false
      tags:
        social:hierarchical:
          name: "Иерархическое общество"
        social:egalitarian:
          name: "Эгалитарное общество"
        social:tribal:
          name: "Племенное общество"
        social:theocratic:
          name: "Теократическое общество"
        social:matriarchal:
          name: "Матриархат"
        social:hive_mind:
          name: "Коллективный разум"
        social:anarchic:
          name: "Анархическое общество"
        social:female_supremacy:
          name: "Женское доминирование"

  # --- ТЕХНОЛОГИИ ---
  technology:
    category: cultural
    technology_level:
      mutually_exclusive: true
      tags:
        tech:primitive:
          name: "Примитивный"
        tech:stone_age:
          name: "Каменный век"
        tech:bronze_age:
          name: "Бронзовый век"
        tech:iron_age:
          name: "Железный век"
        tech:medieval:
          name: "Средневековый"
        tech:scavenged:
          name: "Трофейный"
        tech:organic:
          name: "Органические технологии"
        tech:bio_alchemy:
          name: "Био-алхимия"
        tech:bone_crafting:
          name: "Костоправство"
        tech:silt_weaving:
          name: "Иловое ткачество"
        tech:crystal_tech:
          name: "Кристальные технологии"
        tech:crystal_working:
          name: "Обработка кристаллов"
        tech:mystical:
          name: "Мистические технологии"

  # --- СВЕРХЪЕСТЕСТВЕННЫЕ ПРОЯВЛЕНИЯ ---
  manifestations:
    category: supernatural
    conductivity:
      mutually_exclusive: true
      tags:
        manifestation:numb:
          name: "Немота"
        manifestation:stable:
          name: "Стабильная проводность"
        manifestation:high:
          name: "Высокая проводность"
        manifestation:chaotic:
          name: "Хаотичная проводность"
        manifestation:attuned:
          name: "Настроенный"
          description: "Существа, чувствительные к Проводности."
        manifestation:high_attuned:
          name: "Высоко-настроенный"
        manifestation:network_mind:
          name: "Сетевой разум"
        manifestation:sensory:
          name: "Сенсорное проявление"
          description: "Локация действует как орган чувств мира."

