      scale: 0.08
      octaves: 3
      persistence: 0.4
      
    conductivity:
      scale: 0.06
      octaves: 4
      persistence: 0.5
      
    toxicity:
      scale: 0.05
      octaves: 4
      persistence: 0.5
      
    corruption:
      scale: 0.04
      octaves: 3
      persistence: 0.6
      
    acoustic_resonance:
      scale: 0.07
      octaves: 3
      persistence: 0.4
      
    anomaly_strength:
      scale: 0.06
      octaves: 4
      persistence: 0.5
      
