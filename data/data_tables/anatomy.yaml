# =============================================================================
# АНАТОМИЯ МИРА СИЛЬГАРРОН
# =============================================================================
# Версия схемы: 2.0.0
# Описание: Физическая структура мира - регионы, биомы, лендмарки

meta:
  schema_version: "2.0.0"
  last_updated: "2025-10-05"
  description: "Анатомическая структура живого мира Сильгаррон"


# =============================================================================
# 1. ТИПЫ РЕГИОНОВ (Region Types)
# =============================================================================

REGION_TYPES:
  
  - id: dermal_plateau
    name: "Дермальное плато"
    description: "Обширная равнина, 'кожа' мира, часто подвижная и участвующая в Дыхании."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:dynamic
      fertility: ecology:moderate
    
    defining_tags:
      - location:accessible
      
    spawn_weight: 15
    
    biome_generation:
      allowed_biomes:
        - pulsating_plains
        - spore_savanna
        - geyser_fields
        - crystal_scar
        - megatherium_pastures
        - broken_lands
      
      biome_weights:
        pulsating_plains: 3.0
        spore_savanna: 2.0
        megatherium_pastures: 1.5
        geyser_fields: 0.5
        crystal_scar: 0.1

  - id: lymph_valley
    name: "Долина Лимфотока"
    description: "Плодородная низина, сформированная крупной 'артерией' мира."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:fertile
    
    defining_tags:
      - resource:pure_lymph
      - location:trade_route
      
    spawn_weight: 12
    
    biome_generation:
      allowed_biomes:
        - biolume_forest
        - neuroflower_meadows
        - fungal_mangroves
        - silt_flats
        - blood_clot_thicket
        - springheads
      
      biome_weights:
        biolume_forest: 3.0
        neuroflower_meadows: 2.5
        silt_flats: 1.5
        blood_clot_thicket: 0.3

  - id: spine_ridge
    name: "Хребет-Остов"
    description: "Высокогорная цепь, скелетная основа мира из костехитина."
    
    pillar_tags:
      terrain_type: terrain:elevated
      surface_stability: surface:stable
      fertility: ecology:barren
    
    defining_tags:
      - resource:bone_chitin
      - location:isolated
      - danger:environmental
      
    spawn_weight: 8
    
    biome_generation:
      allowed_biomes:
        - bone_needles
        - litho-lichen_slopes
        - cloud_forest
        - ruined_spires
        - wind_caves
        - crystal_geode
      
      altitude_distribution:
        low: [litho-lichen_slopes, wind_caves]
        mid: [cloud_forest, crystal_geode]
        high: [bone_needles, ruined_spires]

  - id: foothills
    name: "Предгорья"
    description: "Переходная зона между хребтами и равнинами, холмистая местность."
    
    pillar_tags:
      terrain_type: terrain:hill
      surface_stability: surface:stable
      fertility: ecology:moderate
    
    defining_tags:
      - location:transitional_zone
      
    spawn_weight: 10
    
    biome_generation:
      allowed_biomes:
        - rolling_hills
        - broken_lands
        - boneyard
        - fortress_hills
        - springheads
        - spore_savanna
        - biolume_forest
        - litho-lichen_slopes
      
      biome_weights:
        rolling_hills: 3.0
        fortress_hills: 2.0
        broken_lands: 1.5
        springheads: 1.0
        boneyard: 0.5

  - id: alveoli_caves
    name: "Альвеолярные каверны"
    description: "Обширная сеть подземелий, 'легкие' мира с уникальной экосистемой."
    
    pillar_tags:
      terrain_type: terrain:subterranean
      surface_stability: surface:stable
      fertility: ecology:unique
    
    defining_tags:
      - location:underground
      - manifestation:stable
      
    spawn_weight: 7
    
    biome_generation:
      allowed_biomes:
        - luminous_fungi_caves
        - wind_tunnels
        - subterranean_lymph_lake
        - crystal_geode
        - geode_ruins
      
      biome_weights:
        luminous_fungi_caves: 3.0
        wind_tunnels: 2.0
        subterranean_lymph_lake: 1.0
        crystal_geode: 1.5
        geode_ruins: 0.3

  - id: sclerite_delta
    name: "Склеритовая дельта"
    description: "Болотистая местность, где Лимфотоки впадают в океан; 'печень' или 'фильтр' мира."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:unstable
      fertility: ecology:toxic
    
    defining_tags:
      - biome:swamp
      - location:coastal
      - danger:disease
      
    spawn_weight: 4
    
    biome_generation:
      allowed_biomes:
        - toxic_swamp
        - rot_forest
        - mutation_pits
        - unity_expanse
        - filter_beds
        - fungal_mangroves
      
      biome_weights:
        toxic_swamp: 3.0
        rot_forest: 2.0
        filter_beds: 1.5
        mutation_pits: 0.8
        unity_expanse: 0.2

  - id: tendon_strait
    name: "Сухожильный пролив"
    description: "Опасный водный путь, где под поверхностью натянуты гигантские мышечные волокна, вызывающие аномальные течения."
    
    pillar_tags:
      terrain_type: terrain:aquatic
      surface_stability: surface:unstable
      fertility: ecology:moderate
    
    defining_tags:
      - location:aquatic
      - danger:environmental
      
    spawn_weight: 3
    
    biome_generation:
      allowed_biomes:
        - whirlpool_alley
        - graveyard_of_ships
        - kelp_forests
        - rogue_currents
        - abyssal_trench
      
      biome_weights:
        whirlpool_alley: 2.0
        rogue_currents: 2.5
        kelp_forests: 2.0
        graveyard_of_ships: 1.0
        abyssal_trench: 0.5

  - id: scar_tissue
    name: "Рубцовая ткань"
    description: "Местность, где Сильгаррон был серьезно поврежден в прошлом и 'зажил', образовав бесплодный и искаженный ландшафт."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:barren
    
    defining_tags:
      - trait:damaged
      - narrative:ancient_wound
      
    spawn_weight: 3
    
    biome_generation:
      allowed_biomes:
        - barren_wastes
        - glass_desert
        - necrotic_follicle_zone
        - petrified_forest
        - echoing_crater
        - broken_lands
        - geyser_fields
      
      biome_weights:
        barren_wastes: 3.0
        glass_desert: 1.5
        echoing_crater: 1.0
        petrified_forest: 0.8
        necrotic_follicle_zone: 0.3

  - id: chitinous_coast
    name: "Хитиновый берег"
    description: "Отвесная, гладкая стена из черного хитина, служащая панцирем-защитой от океана."
    
    pillar_tags:
      terrain_type: terrain:elevated
      surface_stability: surface:stable
      fertility: ecology:barren
    
    defining_tags:
      - location:coastal
      - location:isolated
      - trait:defensive
      
    spawn_weight: 2
    
    biome_generation:
      allowed_biomes:
        - black_wall
        - barnacle_settlements
        - sea_caves
        - shadow_watch
        - wind_caves
      
      biome_weights:
        black_wall: 3.0
        barnacle_settlements: 1.5
        sea_caves: 2.0
        shadow_watch: 1.0

  - id: ganglion_nexus
    name: "Ганглионный узел"
    description: "Редкая зона вокруг 'нервного узла' Старых Богов с аномально высокой Проводностью."
    
    pillar_tags:
      terrain_type: terrain:subterranean
      surface_stability: surface:stable
      fertility: ecology:unique
    
    defining_tags:
      - manifestation:high
      - anomaly:psychic
      - narrative:old_gods_legacy
      - location:sacred
      - danger:supernatural
      
    spawn_weight: 2
    
    biome_generation:
      allowed_biomes:
        - crystal_synapse_forest
        - memory_pools
        - resonant_gardens
        - silent_zone
        - petrified_forest
      
      required_center: crystal_synapse_forest
      
      biome_weights:
        crystal_synapse_forest: 5.0
        memory_pools: 2.0
        resonant_gardens: 1.5

  - id: sensory_organ
    name: "Сенсорный орган"
    description: "Уникальный, единичный регион, выполняющий особую функцию (например, Глазковое Око)."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:unique
    
    defining_tags:
      - trait:unique
      - manifestation:sensory
      - location:sacred
      
    spawn_weight: 1
    
    biome_generation:
      allowed_biomes:
        - rainbow_caldera
        - singing_cliffs
        - dream_fog_basin
        - memory_pools
      
      required_center: rainbow_caldera
      
      biome_weights:
        rainbow_caldera: 5.0
        singing_cliffs: 2.0
        dream_fog_basin: 2.0


# =============================================================================
# 2. БИОМЫ (Biomes)
# =============================================================================

BIOMES:
  
  # --- БИОМЫ ДЕРМАЛЬНОГО ПЛАТО ---
  
  - id: pulsating_plains
    name: "Пульсирующие равнины"
    description: "Классическая Великая Диафрагма. Равнина, покрытая упругим мхом, чья поверхность медленно и ритмично колеблется."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:dynamic
      fertility: ecology:moderate
    
    defining_tags:
      - location:accessible
      
    compatibility:
      favored_races: [pulsars, dorsals]
      disfavored_races: [kith, ursines]
      can_border: [spore_savanna, megatherium_pastures, biolume_forest]
      cannot_border: [bone_needles, toxic_swamp, crystal_scar]
      
    content_generation:
      common_fauna: [bone_scavenger, nomad_stones]
      common_flora: [pulse_moss, breath_grass]
      resources:
        - id: lymph_pure
          abundance: common
        - id: pulse_moss_extract
          abundance: uncommon
      poi_types:
        - nomad_camp
        - abandoned_watch_tower
        - natural_spring
      poi_density: 3
    
    noise_generation:
      elevation: [0.3, 0.6]
      temperature: [0.4, 0.7]
      moisture: [0.4, 0.8]
      
    spawn_weight: 10

  - id: spore_savanna
    name: "Споровая саванна"
    description: "Сухое плато, где вместо травы растут высокие, похожие на зонтики грибы, постоянно выпускающие в воздух цветную пыльцу."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:moderate
    
    defining_tags:
      - resource:dream_spores
      - danger:environmental
      
    compatibility:
      favored_races: [pulsars, saprophytes]
      disfavored_races: [kith]
      can_border: [pulsating_plains, megatherium_pastures, broken_lands, rolling_hills]
      cannot_border: [biolume_forest, toxic_swamp, subterranean_lymph_lake]
      
    content_generation:
      common_fauna: [spore_grazer, filter_beetle]
      common_flora: [umbrella_fungus, pollen_cactus]
      resources:
        - id: dream_spore
          abundance: common
      poi_types:
        - fungal_grove
        - spore_harvester_camp
      poi_density: 2
    
    noise_generation:
      elevation: [0.4, 0.7]
      temperature: [0.6, 0.9]
      moisture: [0.2, 0.4]
      
    spawn_weight: 8

  - id: geyser_fields
    name: "Гейзерные поля"
    description: "Нестабильный участок 'кожи' мира, где из-подо 'дермы' периодически вырываются струи горячего пара и биоактивных газов."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:unstable
      fertility: ecology:barren
    
    defining_tags:
      - danger:environmental
      - resource:bioactive_gases
      
    compatibility:
      favored_races: []
      disfavored_races: [kith, pulsars, dorsals]
      can_border: [pulsating_plains, barren_wastes, scar_tissue]
      cannot_border: [biolume_forest, toxic_swamp]
      
    content_generation:
      common_fauna: [heat_resistant_lizard, steam_bat]
      common_flora: [thermal_lichen, geyser_reed]
      resources:
        - id: bioactive_gases
          abundance: common
        - id: thermal_minerals
          abundance: uncommon
      poi_types:
        - active_geyser
        - mineral_deposit
        - hazard_zone
      poi_density: 4
    
    noise_generation:
      elevation: [0.3, 0.6]
      temperature: [0.8, 1.0]
      moisture: [0.5, 0.8]
      turbulence: [0.7, 1.0]
      
    spawn_weight: 5

  - id: crystal_scar
    name: "Кристаллический шрам"
    description: "Мертвая, абсолютно плоская зона, где живая плоть мира была заменена монолитной кристаллической структурой (Язва Нового Бога)."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:barren
    
    defining_tags:
      - narrative:new_god_ulcer
      - manifestation:numb
      - danger:supernatural
      - resource:corrupted_crystal
      
    compatibility:
      favored_races: [crystalline_cult]
      disfavored_races: [all_organic]
      can_border: [geyser_fields, barren_wastes, glass_desert]
      cannot_border: [biolume_forest, neuroflower_meadows, any_fertile]
      
      spreading_ulcer: true
      expansion_rate: 0.01
      
    content_generation:
      common_fauna: []
      common_flora: []
      resources:
        - id: corrupted_crystal
          abundance: abundant
      poi_types:
        - crystalline_spire
        - conversion_zone
        - cult_shrine
      poi_density: 1
    
    noise_generation:
      elevation: [0.4, 0.5]
      temperature: [0.3, 0.7]
      moisture: [0.0, 0.1]
      anomaly_strength: [0.9, 1.0]
      
    spawn_weight: 2

  - id: megatherium_pastures
    name: "Пастбища Мегатериев"
    description: "Обширные равнины, по которым мигрируют гигантские стада броненосных травоядных, служащие домом для Дорсалов."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:moderate
    
    defining_tags:
      - location:inhabited
      - narrative:megafauna_migration
      
    compatibility:
      favored_races: [dorsals, pulsars]
      disfavored_races: [kith, fen-kin]
      can_border: [pulsating_plains, spore_savanna, rolling_hills]
      cannot_border: [toxic_swamp, crystal_scar, abyssal_trench]
      
    content_generation:
      common_fauna: [megatherium, dorsals_herder, plains_predator]
      common_flora: [grazing_grass, salt_bush]
      resources:
        - id: megatherium_bone
          abundance: common
        - id: dried_meat
          abundance: common
      poi_types:
        - dorsals_camp
        - watering_hole
        - ancient_path
      poi_density: 3
    
    noise_generation:
      elevation: [0.3, 0.5]
      temperature: [0.4, 0.7]
      moisture: [0.4, 0.7]
      
    spawn_weight: 7

  # --- БИОМЫ ДОЛИНЫ ЛИМФОТОКА ---
  
  - id: biolume_forest
    name: "Биолюмный лес"
    description: "Густой лес из кожистых Бронелистов и Древ-Насосов, где воздух наполнен светящимся Биолюмом, а земля мягкая и плодородная."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:fertile
    
    defining_tags:
      - resource:pure_lymph
      - resource:bioluminescent_sap
      - location:inhabited
      
    compatibility:
      favored_races: [kith, fen-kin, saprophytes, silt_weavers]
      disfavored_races: [barophiles, lithophages]
      can_border: [neuroflower_meadows, fungal_mangroves, springheads, rolling_hills]
      cannot_border: [bone_needles, crystal_scar, barren_wastes]
      
    content_generation:
      common_fauna: [tree_dweller, light_moth, sap_sucker]
      common_flora: [bronze_leaf_tree, pump_tree, glow_mushroom]
      resources:
        - id: lymph_pure
          abundance: abundant
        - id: bioluminescent_sap
          abundance: common
        - id: medicinal_herbs
          abundance: uncommon
      poi_types:
        - village
        - lumber_camp
        - sacred_grove
        - healer_hut
      poi_density: 5
    
    noise_generation:
      elevation: [0.2, 0.5]
      temperature: [0.4, 0.7]
      moisture: [0.7, 0.95]
      
    spawn_weight: 10

  - id: neuroflower_meadows
    name: "Луга Нейроцветов"
    description: "Открытые, залитые лимфой луга, где доминируют растения, реагирующие на Сцепку и эмоции вспышками света или движения."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:stable
      fertility: ecology:fertile
    
    defining_tags:
      - manifestation:stable
      - anomaly:psychic
      - resource:pure_lymph
      
    compatibility:
      favored_races: [pulsars, synaptics, stillborn]
      disfavored_races: [ursines, phages]
      can_border: [biolume_forest, silt_flats, pulsating_plains]
      cannot_border: [toxic_swamp, barren_wastes, crystal_scar]
      
    content_generation:
      common_fauna: [emotion_butterfly, empathic_deer]
      common_flora: [neuroflower, thought_vine, memory_blossom]
      resources:
        - id: neuroflower_extract
          abundance: common
        - id: lymph_pure
          abundance: common
      poi_types:
        - meditation_circle
        - emotion_garden
        - synaptic_node
      poi_density: 3
    
    noise_generation:
      elevation: [0.2, 0.4]
      temperature: [0.5, 0.7]
      moisture: [0.6, 0.9]
      conductivity: [0.6, 0.9]
      
    spawn_weight: 8

  - id: fungal_mangroves
    name: "Грибные мангры"
    description: "Заболоченные берега Лимфотока, где гигантские, похожие на деревья грибы пускают в вязкую лимфу свои 'воздушные' корни."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:unstable
      fertility: ecology:fertile
    
    defining_tags:
      - biome:swamp
      - resource:pure_lymph
      
    compatibility:
      favored_races: [fen-kin, saprophytes, silt_weavers]
      disfavored_races: [kith, dorsals]
      can_border: [biolume_forest, silt_flats, toxic_swamp, filter_beds]
      cannot_border: [bone_needles, crystal_scar]
      
    content_generation:
      common_fauna: [swamp_walker, root_borer, fungal_crab]
      common_flora: [fungal_tree, air_root, slime_moss]
      resources:
        - id: lymph_pure
          abundance: common
        - id: fungal_spores
          abundance: common
      poi_types:
        - fen_kin_stilt_village
        - fungal_harvest_site
      poi_density: 3
    
    noise_generation:
      elevation: [0.1, 0.3]
      temperature: [0.5, 0.8]
      moisture: [0.8, 1.0]
      
    spawn_weight: 7

  - id: silt_flats
    name: "Илистые отмели"
    description: "Широкие, плоские берега, которые обнажаются в сезон Отлива, служа временным домом для городов Иловых Ткачей."
    
    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:dynamic
      fertility: ecology:moderate
    
    defining_tags:
      - location:coastal
      - location:inhabited
      
    compatibility:
      favored_races: [silt_weavers]
      disfavored_races: [barophiles, ursines]
      can_border: [biolume_forest, neuroflower_meadows, fungal_mangroves]
      cannot_border: [bone_needles, crystal_scar]
      
    content_generation:
      common_fauna: [mud_crawler, filter_feeder, tidal_hunter]
      common_flora: [tide_grass, salt_reed]
      resources:
        - id: silt
          abundance: abundant
        - id: lymph_pure
          abundance: common
      poi_types:
        - silt_weaver_camp
        - temporary_market
        - mudflat_farm
      poi_density: 4
    
    noise_generation:
      elevation: [0.1, 0.2]
      temperature: [0.4, 0.7]
      moisture: [0.7, 0.9]
      
    spawn_weight: 6

  - id: springheads
    name: "Истоки"
    description: "Влажная, заболоченная местность, где из-под земли просачивается и собирается в ручьи лимфа, давая начало малым Лимфотокам."

    pillar_tags:
      terrain_type: terrain:flat
      surface_stability: surface:unstable
      fertility: ecology:fertile

    defining_tags:
      - resource:pure_lymph
      - location:transitional_zone

    compatibility:
      favored_races: [fen-kin, silt_weavers, pulsars]
      disfavored_races: [ursines, kith]
      can_border: [rolling_hills, biolume_forest, fungal_mangroves]
      cannot_border: [bone_needles, crystal_scar, barren_wastes]

    content_generation:
      common_fauna: [spring_frog, lymph_skimmer]
      common_flora: [water_reed, spring_moss]
      resources:
        - id: lymph_pure
          abundance: abundant
        - id: spring_water_crystal
          abundance: rare
      poi_types:
        - sacred_spring
        - water_shrine
        - lymph_collector_camp
      poi_density: 3

    noise_generation:
