# =============================================================================
# 4. ПРАВИЛА ГЕНЕРАЦИИ НАСЕЛЕНИЯ
# =============================================================================

POPULATION_GENERATION_RULES:
  
  # Как определить доминирующую расу региона
  dominant_race_selection:
    method: compatibility_weighted
    factors:
      - environmental_compatibility: 0.5
      - resource_availability: 0.2
      - existing_settlements: 0.2
      - historical_presence: 0.1
      
  # Вторичные расы
  secondary_races:
    max_count: 2
    min_compatibility_with_dominant: 0.3
    prefer_allied_races: true
    
  # Размещение поселений
  settlement_placement:
    min_distance_between_same_race: 15  # гексов
    min_distance_between_different_races: 10
    prefer_resource_proximity: true
    avoid_extreme_danger: true
    
  # NPC генерация
  npc_generation:
    per_settlement_size:
      small: [3, 8]      # именованных NPC
      medium: [8, 15]
      large: [15, 30]
      
    role_distribution:
      leader: 1
      merchants: 0.3
      craftsmen: 0.4
      warriors: 0.2
      mystics: 0.1