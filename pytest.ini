[pytest]
# Директории с тестами
testpaths = tests

# Паттерны для поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Дополнительные опции
addopts =
    -v                          # verbose output
    --tb=short                  # shorter traceback format
    --strict-markers            # строгая проверка маркеров
    --disable-warnings          # отключить предупреждения
    -p no:cacheprovider         # отключить кэш (для чистоты)

# Маркеры (для группировки тестов)
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may use database, API)
    slow: Slow tests (LLM calls, generation)
    combat: Tests for combat system
    generation: Tests for world generation

# Минимальная версия pytest
minversion = 7.0
